# power-save.conf — external profile definitions for Power_save.sh
#
# Each profile is a bash function named: profile_<name with - replaced by _>
# e.g. "max-save" -> profile_max_save
#
# Variables (empty string = skip):
#   CPU_MAX_FREQ       kHz, e.g. 1000000
#   CPU_GOVERNOR       powersave | schedutil | performance
#   AMD_PSTATE         passive | active
#   CPU_BOOST          0 | 1
#   GPU_DPM            low | auto | high
#   GPU_DPM_STATE      battery | balanced | performance
#   PANEL_SAVINGS      0..4
#   SCHED_NAME         e.g. scx_lavd
#   SCHED_MODE         powersave | auto | performance
#   STAPM / FAST / SLOW   mW
#   TCTL               °C
#   RYZEN_PS           0 | 1  (enables --power-saving)
#   FAN_MODE           silent | auto | performance
#
# Custom commands (arrays; each entry runs via `bash -c`):
#   APPLY_CMDS=( 'cmd1' 'cmd2' )
#   RESTORE_CMDS=( 'cmd1' 'cmd2' )
#   APPLY_CMDS run AFTER sysfs tuning.
#   RESTORE_CMDS run BEFORE sysfs restore.

PROFILES=(max-save balanced performance)

# ---------------------------------------------------------------------------
profile_max_save() {
  CPU_MAX_FREQ=1000000
  CPU_GOVERNOR=powersave
  AMD_PSTATE=passive
  CPU_BOOST=0
  GPU_DPM=low
  PANEL_SAVINGS=4
  SCHED_NAME=scx_lavd
  SCHED_MODE=powersave
  STAPM=5000
  FAST=5000
  SLOW=5000
  TCTL=50
  RYZEN_PS=1
  FAN_MODE=silent
#auto low high performance manual
  APPLY_CMDS=(
    'pkill emacs 2>/dev/null || true'
    'notify-send "power-save" "max-save applied" 2>/dev/null || true'
  )
  RESTORE_CMDS=(
    ': # max-save has nothing extra to restore'
  )
}

# ---------------------------------------------------------------------------
profile_balanced() {
  CPU_MAX_FREQ=""
  CPU_GOVERNOR=schedutil
  AMD_PSTATE=active
  CPU_BOOST=1
  GPU_DPM=auto
  PANEL_SAVINGS=1
  SCHED_NAME=scx_lavd
  SCHED_MODE=auto
  STAPM=20000
  FAST=25000
  SLOW=22000
  TCTL=85
  RYZEN_PS=0
  FAN_MODE=auto

  APPLY_CMDS=()
  RESTORE_CMDS=()
}

# ---------------------------------------------------------------------------
profile_performance() {
  CPU_MAX_FREQ=""
  CPU_GOVERNOR=performance
  AMD_PSTATE=active
  CPU_BOOST=1
  GPU_DPM=high
  PANEL_SAVINGS=0
  SCHED_NAME=scx_lavd
  SCHED_MODE=gaming
  STAPM=28000
  FAST=35000
  SLOW=30000
  TCTL=95
  RYZEN_PS=0
  FAN_MODE=gaming

  APPLY_CMDS=(
    '/usr/bin/emacs --daemon& 2>/dev/null || true'
    'notify-send "power-save" "performance applied" 2>/dev/null || true'
  )
  RESTORE_CMDS=()
}
