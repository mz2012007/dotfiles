[installer]
hostname = myiso
username = user
timezone = UTC
locale = en_US.UTF-8
keyboard = us
filesystem = ext4
kernel = linux
profile = minimal
bootloader = grub
repo_url = https://repo-default.voidlinux.org/current
arch = x86_64
# Set this before running the UI, or use the disk selection screen
target_disk = /dev/sda
mount_root = /mnt/myiso